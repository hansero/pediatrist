name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install (root)
        run: npm ci

      - name: Install (functions)
        run: npm --prefix functions ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck (Next + functions)
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build functions
        run: npm --prefix functions run build

      - name: Build Next.js
        run: npm run build

  # F0.5: emülatör tabanlı "rules", "functions" ve "e2e" işleri buraya eklenecek
  # (actions/setup-java + firebase emulators:exec).
