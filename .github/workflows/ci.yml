name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install (root)
        run: npm ci

      - name: Install (functions)
        run: npm --prefix functions ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck (Next + functions)
        run: npm run typecheck

      - name: No-mock guard
        run: npm run check:no-mock

      - name: Unit tests
        run: npm run test:unit

      - name: Build functions
        run: npm --prefix functions run build

      - name: Build Next.js
        run: npm run build

  emulator-tests:
    name: Rules, functions and e2e tests (Firebase emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Firebase emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}

      - name: Install (root)
        run: npm ci

      - name: Install (functions)
        run: npm --prefix functions ci

      - name: Build functions
        run: npm --prefix functions run build

      - name: Security rules tests
        run: npm run test:rules

      - name: Functions tests
        run: npm run test:functions

      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Run #8'de `--with-deps` kurulumu 29 dk asılı kaldı (apt). Zaman sınırı + yeniden deneme.
      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          for i in 1 2 3; do
            timeout 180 npx playwright install --with-deps chromium && exit 0
            echo "Deneme $i başarısız, tekrar deneniyor..."; sleep 10
          done
          exit 1

      - name: Install Playwright system dependencies (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        timeout-minutes: 10
        run: |
          for i in 1 2 3; do
            timeout 180 npx playwright install-deps chromium && exit 0
            echo "Deneme $i başarısız, tekrar deneniyor..."; sleep 10
          done
          exit 1

      # Derleme + emülatörler + ~4,5 dk test (F5.5'te süre dolumu senaryosu gerçek saatle ~70 sn ekledi).
      - name: End-to-end tests
        timeout-minutes: 20
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
